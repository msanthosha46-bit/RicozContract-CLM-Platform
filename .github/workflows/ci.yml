name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Test server
        working-directory: server
        run: npm test

      - name: Check server syntax
        working-directory: server
        run: |
          node --check server.js
          node --check routes/reportRoutes.js
          node --check routes/milestoneRoutes.js

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # The client suite was previously never executed by CI: the build step
      # compiles the bundle but never runs the tests, so a regression in the
      # notification, theme, renewal or responsive-overflow suites could reach
      # main unnoticed. These are plain node:test files, not CRA/Jest, so they
      # run with the Node test runner directly.
      - name: Test client
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build
