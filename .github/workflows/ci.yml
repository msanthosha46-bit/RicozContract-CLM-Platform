
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        command: --replSet ricozTestRS --bind_ip_all --port 27018
        ports:
          - 27018:27018
        options: >-
          --health-cmd "mongosh --quiet --port 27018 --eval 'try { rs.status() } catch (e) { rs.initiate({_id: \"ricozTestRS\", members: [{_id: 0, host: \"127.0.0.1:27018\"}]}) }; if (!db.hello().isWritablePrimary) quit(1)'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Test server
        working-directory: server
        env:
          JWT_SECRET: test-only-jwt-secret-not-for-production
          TEST_MONGO_URI: mongodb://127.0.0.1:27018/ricozcontract_ci_test?replicaSet=ricozTestRS
          TEST_JWT_SECRET: ricoz-ci-only-test-secret-not-for-production-2026
        run: npm test

      - name: Check server syntax
        working-directory: server
        run: |
          node --check server.js
          node --check routes/reportRoutes.js
          node --check routes/milestoneRoutes.js

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Test client
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build
