name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    # The routine UI tests now run against the client development server, which
    # Playwright starts via webServer. The client dependencies must be installed
    # from client/package-lock.json before that server can boot.
    - name: Install client dependencies
      working-directory: client
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # Routine CI runs only the non-authenticated UI tests. The credential-bearing
    # dashboard login test is tagged @production-auth and is excluded here; it is
    # also independently gated inside tests/dashboard.spec.ts by an explicit
    # opt-in, so push/pull_request can never submit production credentials even
    # if production test credentials are later added as repository secrets.
    - name: Run Playwright tests (non-authenticated UI only)
      run: npx playwright test --grep-invert "@production-auth"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
