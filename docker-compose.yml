services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ricozcontract
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

  client:
    build:
      context: ./client
      args:
        REACT_APP_API_URL: /api
        REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  mongo_data:
  uploads_data:
